name: Build Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build installer + portable exe
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixel-card-club-windows
          path: |
            release/*.exe
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{ if (f) exit; if ($2 == v) { f=1; next } } f' CHANGELOG.md > notes.md
          {
            echo ""
            echo "**Play in your browser or on iPhone / iPad:** https://bloodrive65.github.io/pixel-card-club/"
            echo ""
            echo "**Windows:** download \`Pixel.Card.Club.Setup.$v.exe\` (installer) or \`PixelCardClub-$v-portable.exe\` (no install) below."
            echo ""
            echo "Older versions: [CHANGELOG.md](https://github.com/bloodrive65/pixel-card-club/blob/master/CHANGELOG.md)"
          } >> notes.md
          cat notes.md
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          body_path: notes.md
