<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Card Club">
<meta name="theme-color" content="#0b0c14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Pixel Card Club</title>
<link rel="icon" href="icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #0b0c14; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; outline: none; }
  html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: none; }
  html.touch, html.touch body { position: fixed; inset: 0; width: 100%; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Pixel Card Club game"></canvas>
<script src="js/font.js"></script>
<script src="assets/cards/deck.js" onerror="this.remove()"></script>
<script src="js/engine.js"></script>
<script src="js/cards.js"></script>
<script src="js/western.js"></script>
<script src="js/decks.js"></script>
<script src="js/ui.js"></script>
<script src="js/roster.js"></script>
<script src="js/table.js"></script>
<script src="js/games/blackjack.js"></script>
<script src="js/games/solitaire.js"></script>
<script src="js/games/gofish.js"></script>
<script src="js/games/war.js"></script>
<script src="js/games/crazy8.js"></script>
<script src="js/games/spider.js"></script>
<script src="js/games/holdem.js"></script>
<script src="js/rulebook.js"></script>
<script src="js/main.js"></script>
<script>
  // offline support when served from the web (not in the desktop app)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
